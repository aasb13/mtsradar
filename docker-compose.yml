# Вся инфраструктура + API + воркер одной командой:  docker compose up --build
# Только инфраструктура (а API/воркер запускать из IDE):  docker compose up -d mongo redis rabbitmq
# Код бэкенда лежит в backend/ (см. backend/README.md); файл данных — data/ в корне репозитория.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # веб-панель: http://localhost:15672  (guest / guest)
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ./backend/.env
    environment: &docker-env
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      DATA_FILE: /app/data/incidents.json
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on: &deps
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: ./backend/.env
    environment:
      <<: *docker-env
      # на Windows/macOS события файловой системы из ./data могут не доходить до контейнера
      WATCH_FORCE_POLLING: "true"
    volumes: ["./data:/app/data"]
    depends_on: *deps

  bot:
    build: ./backend
    command: python -m app.bot
    env_file: ./backend/.env
    environment: *docker-env
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
  rabbit-data:
