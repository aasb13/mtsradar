[project]
name = "incident-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "aiogram>=3.33.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.165.0",
    "google-auth>=2.63.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.13",
    "python-multipart>=0.0.34",
    "redis>=5.2",
    "requests>=2.34.2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # Depends()/Query() в аргументах — нормальная практика FastAPI

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.per-file-ignores]
"scripts/smoke.py" = ["E501", "E702", "ASYNC230"]  # отладочный сценарий, не продакшен-код
"app/ai/prompts.py" = ["E501"]  # промпты — прозовые строки, шире 120 символов не рвать
