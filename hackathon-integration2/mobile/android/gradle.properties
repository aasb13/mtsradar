org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

org.gradle.workers.max=2
org.gradle.parallel=false

# Pub-кэш на C:, проект на F: — Kotlin не умеет строить относительные пути
# между разными корнями и падает на incremental-кэше. Для этого проекта
# инкрементальная компиляция отключена, сборка всё равно быстрая.
kotlin.incremental=false